
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Title</title>

    <link rel="icon" href="favicon.png">

    <style>
        @font-face {
            font-family: "Knewave";
            src: url("../Knewave-Regular.ttf") format("truetype");
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: url("background.png") center center / cover fixed;
            font-family: "Knewave", sans-serif;
            color: #222;
        }

        /* Main popup */

        .popup {
            width: min(850px, 92%);
            margin: 35px auto;
            overflow: hidden;
        }

        .popup-header {
            background: linear-gradient(
                to right,
                #00ccff,
                #0085ff
            );
            padding: 7px 20px;
            text-align: left;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .popup-content {
            background: linear-gradient(
                to bottom,
                #ffffff,
                #a6a6a6
            );
            padding: 25px;
        }

        .close-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            margin: -7px -15px -7px 0;
            padding: 0;
            border: none;
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
        }

        .close-button img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Game description */

        .game-description {
            text-align: center;
            font-size: 25px;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .game-instruction {
            text-align: center;
            font-size: 25px;
            margin-bottom: 20px;
        }

        /* Platform buttons */

        .game-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .button-row {
            display: grid;
            width: 100%;
            gap: 10px;
        }

        .regular-row {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .beta-row {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .gradient-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            padding: 10px 18px;
            border: 10px solid transparent;

            background:
                linear-gradient(
                    to right,
                    #00ccff,
                    #0085ff
                ) padding-box,
                linear-gradient(
                    to right,
                    #0085ff,
                    #00ccff
                ) border-box;

            color: #ffffff;
            font-family: inherit;
            font-size: 20px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;

            transition: filter 0.15s;
        }

        .gradient-button span {
            display: inline-block;
            transform: scaleX(1.5) scaleY(1.5);
        }

        .gradient-button:hover:not(.disabled) {
            filter: brightness(1.12);
        }

        .gradient-button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .beta-button {
            background:
                linear-gradient(to right, #ba2552, #60215d) padding-box,
                linear-gradient(to right, #60215d, #ba2552) border-box;
        }

        /* Mobile layout */

        @media (max-width: 550px) {
            .popup {
                margin: 25px auto;
            }

            .popup-content {
                padding: 15px;
            }

            .button-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Main game popup -->

    <main class="popup">

        <header class="popup-header" id="game-title">
            <span id="game-title-text">Game Title</span>

            <button class="close-button" id="close-button" aria-label="Close">
                <img src="../close.png" alt="">
            </button>
        </header>

        <div class="popup-content">

            <div class="game-description" id="game-description">
                Game Description
            </div>

            <div class="game-instruction">
                Try it out on one of these pages:
            </div>

            <div class="game-buttons" id="game-buttons">
            </div>

        </div>
    </main>

    <script>
        // Game information

        const game = {
            title: "Nemer's RNG",

            description:
                "Test your luck and get super cool auras!",

            itch:
                "https://kingmikegames.itch.io/nemers-rng"
        };

        // Set game information

        document.title = game.title;

        document.getElementById("game-title-text").textContent =
            game.title;

        document.getElementById("game-description").textContent =
            game.description;

        // Generate platform buttons

        const buttonsContainer =
            document.getElementById("game-buttons");

        const regularPlatforms = [
            { name: "Itch.io", url: game.itch },
            { name: "GameJolt", url: game.gamejolt },
            { name: "Scratch", url: game.scratch }
        ];

        const betaPlatforms = [
            { name: "Itch.io (Beta)", url: game.itchBeta },
            { name: "Scratch (Beta)", url: game.scratchBeta }
        ];

        function playSound(name) {
            const sound = new Audio(`../${name}.wav`);
            sound.currentTime = 0;
            sound.play().catch(() => {});
        }

        function createPlatformButton(platform) {
            const button = document.createElement("a");

            button.className = "gradient-button";

            if (platform.name.includes("(Beta)")) {
                button.classList.add("beta-button");
            }

            const label = document.createElement("span");
            label.textContent = platform.name;

            button.appendChild(label);

            if (platform.url) {
                button.href = platform.url;
                button.target = "_blank";
                button.rel = "noopener noreferrer";

                button.addEventListener("click", () => {
                    playSound("confirm");
                });
            } else {
                button.classList.add("disabled");
                button.setAttribute("aria-disabled", "true");

                button.addEventListener("click", event => {
                    event.preventDefault();
                    playSound("locked");
                });
            }

            return button;
        }

        const regularRow = document.createElement("div");
        regularRow.className = "button-row regular-row";

        const betaRow = document.createElement("div");
        betaRow.className = "button-row beta-row";

        regularPlatforms.forEach(platform => {
            regularRow.appendChild(createPlatformButton(platform));
        });

        betaPlatforms.forEach(platform => {
            betaRow.appendChild(createPlatformButton(platform));
        });

        buttonsContainer.appendChild(regularRow);
        buttonsContainer.appendChild(betaRow);

        // Close button

        document.getElementById("close-button").addEventListener("click", () => {
            const closeSound = new Audio("../close.wav");

            closeSound.addEventListener("ended", () => {
                window.location.href = "../index.html";
            }, { once: true });

            closeSound.play().catch(() => {
                window.location.href = "../index.html";
            });
        });
    </script>

</body>
</html>
